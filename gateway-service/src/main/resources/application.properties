spring.application.name=gateway-service
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@clientIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=2
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=3
spring.cloud.gateway.server.webflux.routes[0].id=service-reseau-routes
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-reseau
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/routes,/api/routes/**
spring.cloud.gateway.server.webflux.routes[1].id=customers
spring.cloud.gateway.server.webflux.routes[1].uri=lb://client
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/customers,/api/customers/**
spring.cloud.gateway.server.webflux.routes[2].id=shipments
spring.cloud.gateway.server.webflux.routes[2].uri=${EXPEDITIONS_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/shipments,/api/shipments/**,/api/shipment-notifications
