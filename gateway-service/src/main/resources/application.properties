spring.application.name=gateway-service
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=service-reseau-routes
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-reseau
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/routes,/api/routes/**
spring.cloud.gateway.server.webflux.routes[1].id=customers
spring.cloud.gateway.server.webflux.routes[1].uri=lb://client
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/customers,/api/customers/**